<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes Agrumes">
<meta name="theme-color" content="#E8820C">
<title>Mes Agrumes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F0;--card:#fff;--accent:#E67E22;--accent-l:#FFF0DB;--accent-d:#D35400;--green:#27AE60;--green-l:#E8F8F0;--red:#E74C3C;--red-l:#FDECEB;--blue:#3498DB;--blue-l:#EBF5FB;--purple:#8E44AD;--purple-l:#F4ECF7;--txt:#3D2B1F;--muted:#8B7355;--brd:#F0E0CC;--gold:#D4900A;--shadow:0 2px 12px rgba(61,43,31,.08)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;min-height:100dvh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:72px}
.hdr{background:linear-gradient(145deg,#E67E22 0%,#D35400 50%,#C0392B 100%);color:#fff;padding:24px 20px 40px;padding-top:max(24px,env(safe-area-inset-top));border-radius:0 0 32px 32px;position:relative}
.hdr h1{font-size:24px;font-weight:700;letter-spacing:-.5px}
.hdr-sub{font-size:12px;opacity:.75;margin-top:4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:8px 0 max(12px,env(safe-area-inset-bottom));border-top:none;z-index:100;box-shadow:0 -4px 20px rgba(61,43,31,.08);border-radius:20px 20px 0 0}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:4px 12px;cursor:pointer;font-size:11.5px;font-family:inherit;color:var(--muted);transition:color .2s}
.nav-b.on{color:var(--accent);font-weight:600}
.cd{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 15px rgba(61,43,31,.08);border:none;transition:transform .15s}
.bdg{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11.5px;font-weight:600}
.bdg-a{color:var(--accent);background:var(--accent-l)}.bdg-g{color:var(--green);background:var(--green-l)}.bdg-b{color:var(--blue);background:var(--blue-l)}.bdg-r{color:var(--red);background:var(--red-l)}.bdg-n{color:var(--muted);background:#F0E0CC}
.inp,.sel{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--brd);font-size:16px;font-family:inherit;background:#fff;outline:none;transition:border .2s}
.inp:focus,.sel:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:56px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--gold);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
.fld{margin-bottom:14px}
.btn{padding:10px 20px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,#E67E22,#D35400);color:#fff;box-shadow:0 4px 15px rgba(230,126,34,.35);font-weight:700}.btn-s{background:var(--brd);color:var(--txt)}.btn-w{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-google{background:#fff;color:var(--txt);border:none;padding:14px 28px;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:10px;transition:all .15s;box-shadow:0 4px 15px rgba(61,43,31,.1)}
.btn-google:active{transform:scale(.97)}
.bs{padding:7px 14px;border-radius:10px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s}
.bs:active{transform:scale(.95)}
.bs-a{background:var(--accent-l);color:var(--accent)}.bs-g{background:var(--green-l);color:var(--green)}.bs-r{background:var(--red-l);color:var(--red)}.bs-n{background:#F0E0CC;color:var(--txt)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s}
.tag.on{border-color:currentColor}
.mo{position:fixed;inset:0;background:rgba(61,43,31,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.mc{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px 20px calc(32px + env(safe-area-inset-bottom,0px));animation:su .3s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sec{padding:16px}
.sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sc{text-align:center;padding:12px;cursor:pointer}
.sn{font-size:24px;font-weight:700;margin-top:4px}
.sl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.gg{display:grid;gap:6px}
.gc{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:500;cursor:pointer;padding:2px;text-align:center;transition:all .15s;border:0.5px solid var(--brd);background:#F5EDE0;color:var(--muted)}
.gc.hp{background:var(--green-l);color:var(--green)}.gc.sel{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(232,130,12,.15)}
.gc:active{transform:scale(.94)}
.tgl{width:48px;height:28px;border-radius:14px;border:none;cursor:pointer;position:relative;background:#F0E0CC;transition:background .3s}
.tgl.on{background:var(--accent)}
.tgl-k{width:22px;height:22px;border-radius:11px;background:#fff;position:absolute;top:3px;left:3px;transition:left .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on .tgl-k{left:23px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.fb{display:flex;justify-content:space-between;align-items:center}
.fc{display:flex;align-items:center}
.g1{flex:1}
.w100{width:100%}.jc{justify-content:center}
.ri{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F5EDE0}
.ri:last-child{border-bottom:none}
.ir{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F5EDE0;font-size:13px}
.ir:last-child{border-bottom:none}
.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(145deg,#E8820C,#D4740A);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}
.splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-i{font-size:72px;animation:bn 1.2s ease infinite}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:40px 20px;text-align:center}
.login-logo{font-size:64px;margin-bottom:16px}
.login-title{font-size:28px;font-weight:700;color:var(--txt);margin-bottom:8px}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:32px;max-width:300px;line-height:1.5}
.sync-bar{background:var(--accent-l);padding:6px 16px;font-size:12px;color:var(--accent);text-align:center;font-weight:500;border-radius:0 0 12px 12px}
.user-bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;background:rgba(255,255,255,.15);border-radius:10px;font-size:12px}
.user-bar img{width:24px;height:24px;border-radius:50%}
.sec-label{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:8px 0 12px}
.kpi-row{display:flex;gap:10px;margin:-22px 16px 18px;position:relative;z-index:1}
.kpi{flex:1;background:#fff;border-radius:16px;padding:16px 10px;border:none;box-shadow:0 4px 15px rgba(61,43,31,.1);text-align:center}
.kpi .kn{font-size:26px;font-weight:700}
.kpi .kl{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.qk{background:#fff;border-radius:16px;padding:16px;border:none;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 3px 15px rgba(61,43,31,.08);transition:transform .15s}
.qk:active{transform:scale(.97)}
.qk-ico{font-size:24px}
.qk-tl{font-size:13px;font-weight:700;color:var(--txt)}
.qk-tv{font-size:11.5px;color:var(--muted)}
.alert-bar{background:linear-gradient(135deg,#FFF3E0,#FFE8CC);border:none;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px;box-shadow:0 2px 8px rgba(230,126,34,.12)}
.alert-bar .adot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-bar p{font-size:12px;font-weight:500;margin:0}
.mc input,.mc textarea,.mc select{-webkit-user-select:text;user-select:text}
</style>

<script>
(function(){
"use strict";

// ── Firebase Config ──
firebase.initializeApp({
  apiKey:"AIzaSyBkVTjlsdZvQ-vEYda4fO-4X-Ni6O1sFR4",

  projectId:"mes-agrumes",

  messagingSenderId:"531593370997",
  appId:"1:531593370997:web:165aec418c2fda339ec73c",
  measurementId:"G-M3KVMZEL29"
});

var auth=firebase.auth();
var db=firebase.firestore();

// Enable offline cache so data persists between page reloads
db.enablePersistence({synchronizeTabs:true}).catch(function(e){
  console.log('Persistence error:',e.code);
});

// Keep auth session between reloads
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

var provider=new firebase.auth.GoogleAuthProvider();
var currentUser=null;

// ── Data ──
var DD={plants:[],careLogs:[],greenhouse:{width:6,height:4,positions:{}},settings:{wateringReminder:true,wateringInterval:3,wiSerre:5,wiTerre:10,winterSlow:true,rainSkip:true,tasksDone:{},weatherAlerts:true,weatherLat:48.86,weatherLon:2.35,weatherCity:'Paris'}};
var D=JSON.parse(JSON.stringify(DD));
var weatherData=null;
var weatherLoading=false;

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function td(){var d=new Date(),m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function fd(d){return d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'\u2014'}

var LOCS=[{v:'serre',l:'\ud83c\udfe0 Serre',c:'a'},{v:'pot',l:'\ud83e\udeb4 Pot (ext.)',c:'b'},{v:'pleine_terre',l:'\ud83c\udf31 Pleine terre',c:'g'}];
var VER='6.1';
var RUST=[];for(var ri=0;ri>=-25;ri--)RUST.push({v:''+ri,l:ri+'°C'});
function rustOpts(cur){
  cur=(cur===undefined||cur===null)?'':''+cur;
  var list=RUST.slice();
  if(cur!==''&&!list.some(function(r){return r.v===cur}))list.unshift({v:cur,l:cur+'°C'});
  return list.map(function(r){return '<option value="'+r.v+'"'+(cur===r.v?' selected':'')+'>'+r.l+'</option>'}).join('');
}
var MONTHS=['Janvier','F\u00e9vrier','Mars','Avril','Mai','Juin','Juillet','Ao\u00fbt','Septembre','Octobre','Novembre','D\u00e9cembre'];
var USAGES=['Fruit de bouche','Cuisine','Jus','Zestes','Confiture / Marmelade','D\u00e9coration / Parfum','Autre'];
var FERTS=['Engrais agrumes (NPK)','Engrais organique','Fer ch\u00e9lat\u00e9','Oligo-\u00e9l\u00e9ments','Compost','Autre'];
var CARE_TYPES=[
  {v:'watering',e:'💧',l:'Arrosage',c:['var(--blue-l)','var(--blue)']},
  {v:'fertilizer',e:'🧪',l:'Engrais',c:['var(--green-l)','var(--green)']},
  {v:'fruit',e:'🍊',l:'Récolte',c:['var(--accent-l)','var(--accent)']},
  {v:'repot',e:'🪴',l:'Rempotage',c:['var(--accent-l)','var(--accent-d)']},
  {v:'prune',e:'✂️',l:'Taille',c:['var(--blue-l)','var(--blue)']},
  {v:'treat',e:'🛡️',l:'Traitement',c:['var(--purple-l)','var(--purple)']},
  {v:'winter_in',e:'🏠',l:'Rentrée à l\'abri',c:['var(--green-l)','var(--green)']},
  {v:'winter_out',e:'☀️',l:'Sortie',c:['var(--accent-l)','var(--accent)']},
  {v:'other',e:'📝',l:'Note',c:['#F0EDE6','var(--muted)']}
];
var TE={},TL={},CARE_COLS={};
CARE_TYPES.forEach(function(t){TE[t.v]=t.e;TL[t.v]=t.l;CARE_COLS[t.v]=t.c});
var CARE_FILTERS=[{id:'all',l:'Tous'},{id:'watering',l:'💧 Arrosage'},{id:'fertilizer',l:'🧪 Engrais'},{id:'fruit',l:'🍊 Fruits'},{id:'repot',l:'🪴 Rempotage'},{id:'prune',l:'✂️ Taille'},{id:'treat',l:'🛡️ Traitement'}];
var careLimit=100;
// Plante en pleine terre : dehors, ou placee sur le plan de la serre (plantee dans le sol de la serre)
function inGround(p){
  if(p.location==='pleine_terre')return true;
  if(p.location!=='serre')return false;
  var pos=(D.greenhouse&&D.greenhouse.positions)||{};
  return Object.keys(pos).some(function(k){return pos[k]===p.id});
}
// Date du dernier rempotage d'une plante (soin "Rempotage", ou ancien soin dont la note contient "rempot")
function lastRepotDate(pid){
  var last=null;
  D.careLogs.forEach(function(l){
    if(l.plantId!==pid)return;
    if(l.type==='repot'||(l.notes&&l.notes.toLowerCase().indexOf('rempot')>=0)){if(!last||l.date>last)last=l.date;}
  });
  return last;
}
function locI(v){for(var i=0;i<LOCS.length;i++)if(LOCS[i].v===v)return LOCS[i];return LOCS[0]}
function bc(c){return c==='a'?'bdg-a':c==='b'?'bdg-b':c==='r'?'bdg-r':c==='n'?'bdg-n':'bdg-g'}

// Rythme d'arrosage selon l'emplacement, espace en hiver
function wInt(loc){
  var s=D.settings,b=loc==='serre'?(s.wiSerre||5):loc==='pleine_terre'?(s.wiTerre||10):(s.wateringInterval||3);
  var m=new Date().getMonth();
  if(s.winterSlow!==false&&(m>=10||m<=1))b=b*2;
  return b;
}
function rainedRecently(){return !!(D.settings.rainSkip!==false&&weatherData&&weatherData.rain3>=5)}
function lastWaterMap(){
  var last={};
  D.careLogs.forEach(function(l){if(l.type==='watering'&&(!last[l.plantId]||l.date>last[l.plantId]))last[l.plantId]=l.date});
  return last;
}
function nw(){
  if(!D.settings.wateringReminder)return[];
  var now=new Date(),rain=rainedRecently(),last=lastWaterMap();
  return D.plants.filter(function(p){
    if(p.location==='pleine_terre'&&rain)return false;
    var d=last[p.id];
    return !d||(now-new Date(d+'T00:00:00'))/864e5>=wInt(p.location);
  });
}

// -- Meteo / alertes gel --
function fetchWeather(basic){
  if(weatherLoading||!D.settings.weatherAlerts)return;
  var lat=D.settings.weatherLat||48.86,lon=D.settings.weatherLon||2.35;
  weatherLoading=true;
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=temperature_2m_min,temperature_2m_max'+(basic?'':',weather_code,precipitation_sum')+'&timezone=auto&forecast_days=5'+(basic?'':'&past_days=3');
  fetch(url).then(function(r){return r.json()}).then(function(data){
    weatherLoading=false;
    if(data&&data.daily){
      var t=data.daily.time||[],today=td(),i0=0;
      for(var i=0;i<t.length;i++){if(t[i]>=today){i0=i;break;}}
      var pr=data.daily.precipitation_sum||[],rain=0;
      for(var j=0;j<i0;j++)rain+=pr[j]||0;
      weatherData={
        dates:t.slice(i0),
        mins:(data.daily.temperature_2m_min||[]).slice(i0),
        maxs:(data.daily.temperature_2m_max||[]).slice(i0),
        codes:(data.daily.weather_code||[]).slice(i0),
        rain3:Math.round(rain*10)/10
      };
      R();
    }else if(!basic){fetchWeather(true);} // secours : demande simple, sans pluie ni icones
  }).catch(function(){weatherLoading=false;if(!basic)fetchWeather(true);});
}

function wIcon(c,cold){
  if(c===null||c===undefined)return cold?'\u2744\ufe0f':'\u{1F321}\ufe0f';
  if(c===0)return '\u2600\ufe0f';
  if(c<=2)return '\u{1F324}\ufe0f';
  if(c===3)return '\u2601\ufe0f';
  if(c<=48)return '\u{1F32B}\ufe0f';
  if(c<=67)return '\u{1F327}\ufe0f';
  if(c<=77)return '\u{1F328}\ufe0f';
  if(c<=82)return '\u{1F326}\ufe0f';
  if(c<=86)return '\u{1F328}\ufe0f';
  return '\u26c8\ufe0f';
}

function getFrostAlerts(){
  if(!weatherData||!D.settings.weatherAlerts||!D.plants.length)return[];
  var alerts=[];
  weatherData.dates.forEach(function(date,i){
    var minTemp=weatherData.mins[i];
    var endangered=D.plants.filter(function(p){
      var rust=parseInt(p.rusticity)||0;
      return minTemp<=rust+2; // alerte si la temp s'approche à 2° de la rusticité
    });
    if(endangered.length>0){
      var d=new Date(date+'T00:00:00');
      var dayName=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'});
      alerts.push({date:dayName,minTemp:minTemp,maxTemp:weatherData.maxs[i],
        plants:endangered.filter(function(p){return p.location!=='serre'}),
        serre:endangered.filter(function(p){return p.location==='serre'})});
    }
  });
  return alerts;
}

function rFrostBanner(){
  var alerts=getFrostAlerts();
  if(!alerts.length)return '';
  var h='<div class="cd" style="background:var(--red-l);border:2px solid var(--red)">';
  h+='<div class="fc" style="gap:8px;margin-bottom:8px"><span style="font-size:22px">\u{1F976}</span><strong style="color:var(--red)">Alerte gel !</strong></div>';
  alerts.forEach(function(a){
    h+='<div style="margin-bottom:10px;padding:8px;background:rgba(255,255,255,.5);border-radius:10px">';
    h+='<div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:4px">'+esc(a.date)+' : '+a.minTemp+'\u00b0C min / '+a.maxTemp+'\u00b0C max</div>';
    if(a.plants.length){
      h+='<div style="font-size:12px;color:var(--txt)">Plantes en danger :</div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">';
      a.plants.forEach(function(p){
        h+='<span class="bdg bdg-r">'+(p.photo?'':'🍊 ')+esc(p.name)+' ('+p.rusticity+'°C)</span>';
      });
      h+='</div>';
    }
    if(a.serre.length){
      h+='<div style="font-size:12px;color:var(--txt);margin-top:6px">À l\'abri en serre (à surveiller) :</div>';
      h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">';
      a.serre.forEach(function(p){
        h+='<span class="bdg bdg-n">🏠 '+esc(p.name)+' ('+p.rusticity+'°C)</span>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<div style="font-size:12px;color:var(--muted);margin-top:4px">Pr\u00e9visions pour '+(D.settings.weatherCity||'Paris')+' \u2022 Alerte si temp. approche \u00e0 2\u00b0C de la rusticit\u00e9</div>';
  h+='</div>';
  return h;
}

function rWeatherSummary(){
  if(!weatherData)return '';
  var h='<div class="cd" style="padding:12px"><div class="fc" style="gap:6px;margin-bottom:8px"><span style="font-size:16px">\u{1F321}\ufe0f</span><strong style="font-size:13px">M\u00e9t\u00e9o '+(D.settings.weatherCity||'Paris')+'</strong></div>';
  h+='<div style="display:flex;gap:6px;overflow-x:auto">';
  weatherData.dates.forEach(function(date,i){
    var d=new Date(date+'T00:00:00');
    var day=d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'});
    var min=weatherData.mins[i],max=weatherData.maxs[i];
    var cold=min<=0;
    h+='<div style="text-align:center;padding:6px 8px;border-radius:8px;min-width:60px;background:'+(cold?'var(--red-l)':'#F5F3EF')+'"><div style="font-size:12px;color:var(--muted)">'+day+'</div>';
    h+='<div style="font-size:18px;margin:2px 0">'+wIcon(weatherData.codes?weatherData.codes[i]:null,cold)+'</div>';
    h+='<div style="font-size:12px;font-weight:700;color:'+(cold?'var(--red)':'var(--txt)')+'">'+Math.round(min)+'\u00b0</div>';
    h+='<div style="font-size:12px;color:var(--muted)">'+Math.round(max)+'\u00b0</div></div>';
  });
  h+='</div></div>';
  return h;
}

// ── Fertilization Advice ──
function getFertAdvice(plant){
  var m=new Date().getMonth(); // 0=jan
  var inPot=plant.location==='pot'||plant.location==='serre';
  var advice={icon:'',title:'',text:'',actions:[]};

  if(m>=2&&m<=4){ // Mars-Mai : Reprise + Floraison
    advice.icon='\ud83c\udf31';
    advice.title='Reprise de v\u00e9g\u00e9tation';
    if(m===2){
      advice.text='C\'est le moment de relancer la fertilisation ! Apporte un engrais organique riche en azote (NPK 5-6-9 ou similaire) pour stimuler la croissance et pr\u00e9parer la floraison.';
      advice.actions=['Engrais organique complet','Fer ch\u00e9lat\u00e9 si feuilles jaunes'];
    } else if(m===3){
      advice.text='Pleine p\u00e9riode de floraison. Continue la fertilisation mensuelle. Le potassium est important pour la nouaison (formation des fruits).';
      advice.actions=['Engrais organique complet','Oligo-\u00e9l\u00e9ments en foliaire'];
    } else {
      advice.text='Fin de floraison et d\u00e9but de nouaison. Fertilise r\u00e9guli\u00e8rement pour assurer la fixation des jeunes fruits sur l\'arbre.';
      advice.actions=['Engrais organique complet'];
    }
    if(inPot)advice.text+='\n\ud83e\udeb4 En pot : environ 5-6g par litre de terreau.';
    else advice.text+='\n\ud83c\udf31 En pleine terre : 600 \u00e0 900g selon la taille de l\'arbre.';
  } else if(m>=5&&m<=7){ // Juin-Ao\u00fbt : Grossissement fruits
    advice.icon='\ud83c\udf4a';
    advice.title='Grossissement des fruits';
    advice.text='Les fruits grossissent, les besoins en potassium augmentent. Continue la fertilisation mensuelle avec un engrais \u00e9quilibr\u00e9.';
    if(m===7)advice.text+=' En ao\u00fbt, fais un dernier apport pour pr\u00e9parer la mise en r\u00e9serve avant l\'automne.';
    advice.actions=['Engrais organique complet','Potassium si beaucoup de fruits'];
    if(inPot)advice.text+='\n\ud83e\udeb4 En pot : fertilise chaque mois, arrose bien apr\u00e8s l\'apport.';
    else advice.text+='\n\ud83c\udf31 En pleine terre : un apport tous les 2-3 mois suffit.';
  } else if(m>=8&&m<=9){ // Sept-Oct : Fin de saison
    advice.icon='\ud83c\udf42';
    advice.title='Fin de saison';
    advice.text='Dernier apport d\'engrais de la saison (septembre). La plante fait ses r\u00e9serves avant le repos hivernal. Privil\u00e9gie le potassium pour renforcer la r\u00e9sistance au froid.';
    advice.actions=['Dernier apport d\'engrais organique','Potasse pour la r\u00e9sistance au froid'];
    if(m===9){advice.text='⚠️ Arrête la fertilisation en octobre. La plante entre en repos.';advice.actions=[];}
  } else { // Nov-F\u00e9v : Repos
    advice.icon='\u2744\ufe0f';
    advice.title='Repos hivernal';
    advice.text='Pas de fertilisation en hiver ! La plante est au repos. Les racines n\'absorbent quasiment rien quand il fait froid (en dessous de 10\u00b0C).';
    advice.actions=[];
    if(m===1)advice.text+=' \ud83d\udcc5 Pr\u00e9pare ton engrais, la reprise approche en mars !';
  }

  return advice;
}

function rFertSection(){
  if(!D.plants.length)return '';
  var m=new Date().getMonth();
  var monthName=MONTHS[m];
  var h='<div style="margin-top:12px"><div class="fb" style="margin-bottom:8px"><h3 style="font-size:16px">\ud83e\uddea Conseils fertilisation</h3><span class="bdg bdg-g">'+monthName+'</span></div>';

  // Group by similar advice (pot vs pleine terre)
  var potPlants=D.plants.filter(function(p){return p.location==='pot'||p.location==='serre'});
  var terrePlants=D.plants.filter(function(p){return p.location==='pleine_terre'});

  if(potPlants.length){
    var adv=getFertAdvice(potPlants[0]);
    h+='<div class="cd" style="padding:14px"><div class="fc" style="gap:8px;margin-bottom:6px"><span style="font-size:18px">'+adv.icon+'</span><strong style="font-size:14px">'+adv.title+' \u2014 Pots & Serre</strong></div>';

// Envoie les photos pas encore rang\u00e9es \u00e0 part. La photo n'est retir\u00e9e de la
// sauvegarde principale qu'une fois l'envoi confirm\u00e9 (aucun risque de perte).
function syncPhotos(){
  if(!currentUser||photoBlocked)return;
  D.plants.forEach(function(p){
    if(!p.photo)return;
    var sg=psig(p.photo);
    if(sg===p.photoCloud||photoBusy[p.id]===sg)return;
    var pid=p.id;
    photoBusy[pid]=sg;
    photosRef().doc(pid).set({data:p.photo,sig:sg}).then(function(){
      if(photoBusy[pid]===sg)delete photoBusy[pid];
      var cur=D.plants.find(function(x){return x.id===pid});
      if(cur&&psig(cur.photo)===sg){
        cur.photoCloud=sg;cur.u=Date.now();
        clearTimeout(photoFlushT);
        photoFlushT=setTimeout(function(){saveToLocal();saveToFirebase();},800);
      }
    }).catch(function(e){
      if(photoBusy[pid]===sg)delete photoBusy[pid];
      console.error('Photo sync error:',e);
      if(e&&e.code==='permission-denied'){photoBlocked=true;setCloud(cloudState);}
    });
  });
}

// === SYNCHRONISATION PAR FUSION ===
// Chaque element (plante, soin, variete) porte la date de sa derniere modification (u).
// Avant d'ecrire en ligne, on lit ce qui s'y trouve et on fusionne element par element :
// la version la plus recente de chaque element gagne. Rien n'est ecrase en bloc.
var dataLoaded=false;
var _migrationDone=false;
var snap={},localEditedAt=0,syncBusy=false,syncAgain=false,syncTimer=null,lastSyncAt=0;
var KEEP_DEL=180*864e5;

function norm(d){
  d=d||{};
  return {plants:d.plants||[],careLogs:d.careLogs||[],wishlist:d.wishlist||[],
    greenhouse:d.greenhouse||null,greenhouseU:d.greenhouseU||0,
    settings:d.settings||null,settingsU:d.settingsU||0,
    wishlistInited:!!d.wishlistInited,encV5:!!d.encV5,flagsU:d.flagsU||0,
    deleted:d.deleted||{},syncV:d.syncV||0};
}
function localData(){var l=norm(D);l.syncV=2;return l;}
function toCloud(m){var c=Object.assign({},m);c.plants=cloudPlantsOf(m.plants);c.syncV=2;return c;}
function setD(d){
  var n=norm(d);
  D.plants=n.plants;D.careLogs=n.careLogs;D.wishlist=n.wishlist;
  D.greenhouse=n.greenhouse||JSON.parse(JSON.stringify(DD.greenhouse));D.greenhouseU=n.greenhouseU;
  D.settings=Object.assign(JSON.parse(JSON.stringify(DD.settings)),n.settings||{});D.settingsU=n.settingsU;
  D.wishlistInited=n.wishlistInited;D.encV5=n.encV5;D.flagsU=n.flagsU;
  D.deleted=n.deleted;D.syncV=2;
}

// Texte stable (cles triees) pour comparer deux contenus
function stable(v){
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  if(v&&typeof v==='object'){
    return '{'+Object.keys(v).sort().filter(function(k){return v[k]!==undefined}).map(function(k){return JSON.stringify(k)+':'+stable(v[k])}).join(',')+'}';
  }
  return JSON.stringify(v===undefined?null:v);
}
function sigItem(x,isPlant){
  var c=Object.assign({},x);delete c.u;
  if(isPlant){c.photo=x.photo?psig(x.photo):(x.photoCloud||'');delete c.photoCloud;}
  return stable(c);
}
function rebuildSnap(){
  snap={};
  ['plants','careLogs','wishlist'].forEach(function(k){
    var m={};(D[k]||[]).forEach(function(x){if(x&&x.id)m[x.id]=sigItem(x,k==='plants')});snap[k]=m;
  });
  snap._greenhouse=stable(D.greenhouse);snap._settings=stable(D.settings);
  snap._flags=stable([!!D.wishlistInited,!!D.encV5]);
}
// Repere ce qui a change depuis la derniere fois : date les elements modifies,
// et note les elements supprimes pour qu'ils ne reviennent pas d'un autre appareil.
function stampChanges(){
  var now=Date.now();
  if(!D.deleted)D.deleted={};
  ['plants','careLogs','wishlist'].forEach(function(k){
    var prev=snap[k]||{},cur={};
    (D[k]||[]).forEach(function(x){
      if(!x||!x.id)return;
      var sg=sigItem(x,k==='plants');cur[x.id]=sg;
      if(prev[x.id]!==sg)x.u=now;
    });
    Object.keys(prev).forEach(function(id){if(!(id in cur))D.deleted[id]=now});
    snap[k]=cur;
  });
  var g=stable(D.greenhouse);if(snap._greenhouse!==g){D.greenhouseU=now;snap._greenhouse=g;}
  var st=stable(D.settings);if(snap._settings!==st){D.settingsU=now;snap._settings=st;}
  var f=stable([!!D.wishlistInited,!!D.encV5]);if(snap._flags!==f){D.flagsU=now;snap._flags=f;}
  D.syncV=2;
}

// Fusionne L (cet appareil) et R (en ligne). tieLocal : qui gagne en cas d'egalite.
function mergeData(L,R,tieLocal){
  var now=Date.now(),del={};
  [R.deleted,L.deleted].forEach(function(m){
    Object.keys(m||{}).forEach(function(id){
      if(now-m[id]<KEEP_DEL&&(!del[id]||m[id]>del[id]))del[id]=m[id];
    });
  });
  function ml(a,b){
    var map={},order=[];
    (b||[]).forEach(function(x){if(x&&x.id&&!map[x.id]){map[x.id]=x;order.push(x.id)}});
    (a||[]).forEach(function(x){
      if(!x||!x.id)return;
      var r=map[x.id];
      if(!r){map[x.id]=x;order.push(x.id);return;}
      var xu=x.u||0,ru=r.u||0;
      if(xu>ru||(xu===ru&&tieLocal))map[x.id]=x;
    });
    return order.map(function(id){return map[id]}).filter(function(x){return !(del[x.id]&&del[x.id]>=(x.u||0))});
  }
  function one(k){
    var lu=L[k+'U']||0,ru=R[k+'U']||0;
    if(!R[k])return [L[k],lu];
    if(!L[k])return [R[k],ru];
    return (lu>ru||(lu===ru&&tieLocal))?[L[k],lu]:[R[k],ru];
  }
  var M={deleted:del,syncV:2};
  M.plants=ml(L.plants,R.plants);
  var ids={};M.plants.forEach(function(p){ids[p.id]=true});
  M.careLogs=ml(L.careLogs,R.careLogs).filter(function(l){return ids[l.plantId]});
  // Varietes : evite les doublons si l'encyclopedie a ete creee sur deux appareils
  var wl=ml(L.wishlist,R.wishlist),seen={},drop={};
  function fresh(w){return !w.u&&w.status==='a_voir'&&!w.notes}
  wl.forEach(function(w){
    var n=(w.name||'').toLowerCase().trim(),o=seen[n];
    if(!o){seen[n]=w;return;}
    if(fresh(w))drop[w.id]=true;
    else if(fresh(o)){drop[o.id]=true;seen[n]=w;}
  });
  M.wishlist=wl.filter(function(w){return !drop[w.id]});
  var g=one('greenhouse');M.greenhouseU=g[1];
  M.greenhouse=g[0]?JSON.parse(JSON.stringify(g[0])):null;
  if(M.greenhouse&&M.greenhouse.positions){
    Object.keys(M.greenhouse.positions).forEach(function(k){if(!ids[M.greenhouse.positions[k]])delete M.greenhouse.positions[k]});
  }
  var se=one('settings');M.settings=se[0];M.settingsU=se[1];
  var lf=L.flagsU||0,rf=R.flagsU||0;
  if(lf>rf){M.wishlistInited=L.wishlistInited;M.encV5=L.encV5;M.flagsU=lf;}
  else if(rf>lf){M.wishlistInited=R.wishlistInited;M.encV5=R.encV5;M.flagsU=rf;}
  else{M.wishlistInited=L.wishlistInited||R.wishlistInited;M.encV5=L.encV5||R.encV5;M.flagsU=lf;}
  return M;
}

function applyMerged(M){

  var prevPlants=D.plants;

function dirtyKey(){return 'agrumes_dirty_'+currentUser.uid}
function isDirty(){try{return localStorage.getItem(dirtyKey())==='1'}catch(e){return false}}
function setDirty(v){try{if(v)localStorage.setItem(dirtyKey(),'1');else localStorage.removeItem(dirtyKey())}catch(e){}}

function syncNow(){
  if(!currentUser)return;
  if(syncBusy){syncAgain=true;return;}
  syncBusy=true;syncAgain=false;
  var uid=currentUser.uid,ref=db.collection('users').doc(uid);
  if(isDirty())setCloud('pending');
  syncPhotos();
  db.runTransaction(function(tx){
    return tx.get(ref).then(function(doc){
      var raw=doc.exists?doc.data():null;
      var Rm=norm(raw);
      var st=(raw&&raw.updatedAt&&raw.updatedAt.toMillis)?raw.updatedAt.toMillis():0;
      var M=mergeData(localData(),Rm,localEditedAt>st);
      var out=toCloud(M);
      if(!doc.exists||stable(out)!==stable(Rm)){
        out.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
        tx.set(ref,out);
      }
      return M;
    });
  }).then(function(M){
    syncBusy=false;
    if(!currentUser||currentUser.uid!==uid)return;
    lastSyncAt=Date.now();
    var first=!dataLoaded;dataLoaded=true;
    applyMerged(M);
    if(first){R();if(!weatherData&&D.settings.weatherAlerts)fetchWeather();}
    if(syncAgain){syncNow();}

function loadData(){
  if(!currentUser)return;
  var loaded=false;
  snap={};localEditedAt=0;syncBusy=false;syncAgain=false;
  // 1. Ce qui est enregistre sur cet appareil s'affiche tout de suite
  try{
    var raw=localStorage.getItem('agrumes_'+currentUser.uid);
    if(raw){
      var d=JSON.parse(raw);
      setD(d);
      localEditedAt=d.editedAt||d.savedAt||0;
      loaded=true;
    }
  }catch(e){console.error('localStorage load error:',e);}
  rebuildSnap();
  if(loaded){
    dataLoaded=true;
    R();
    if(!weatherData&&D.settings.weatherAlerts)fetchWeather();
    hydratePhotos([]);
  }
  // 2. Puis fusion avec la sauvegarde en ligne (changements des autres appareils)
  syncNow();
}

function persist(){
  stampChanges();
  localEditedAt=Date.now();
  setDirty(true);
  saveToLocal();     // tout de suite sur l'appareil
  saveToFirebase();  // puis fusion avec la sauvegarde en ligne
}

function initWishlist(){
  if(!D.wishlist){D.wishlist=[];D.wishlistInited=false;}
  if(!D.wishlistInited){
    ENC_DEFAULTS.forEach(function(v){
      D.wishlist.push({id:gid(),name:v.n,rusticity:v.r,fruct:v.fruct||[],fb:v.fb,fc:v.fc,
        priority:v.int||3,status:'a_voir',notes:'',cat:v.cat||'',type:v.type||'',usage:v.usage||'',rem:v.rem||'',src:v.src||''});
    });
    D.wishlistInited=true;
    _migrationDone=true;
    persist();
  }
  // Migration v5: enrich existing entries with new data + add missing varieties
  // Run only once per session, using both server flag and local flag
  if(!D.encV5&&!_migrationDone){
    var existingNames={};
    D.wishlist.forEach(function(w){existingNames[w.name.toLowerCase()]=true;});
    // Enrich existing entries that lack cat/type/rem/src
    D.wishlist.forEach(function(w){
      if(!w.cat){
        var match=ENC_DEFAULTS.find(function(e){return e.n.toLowerCase()===w.name.toLowerCase()});
        if(match){
          w.cat=match.cat||'';w.type=match.type||'';w.usage=match.usage||'';
          w.rem=match.rem||'';w.src=match.src||'';
          if(!w.fruct||!w.fruct.length)w.fruct=match.fruct||[];
          w.fb=match.fb;w.fc=match.fc;
        }
      }
    });
    // Add missing varieties from the new encyclopedia
    ENC_DEFAULTS.forEach(function(v){
      if(!existingNames[v.n.toLowerCase()]){
        D.wishlist.push({id:gid(),name:v.n,rusticity:v.r,fruct:v.fruct||[],fb:v.fb,fc:v.fc,
          priority:v.int||3,status:'a_voir',notes:'',cat:v.cat||'',type:v.type||'',usage:v.usage||'',rem:v.rem||'',src:v.src||''});
      }
    });
    D.encV5=true;
    _migrationDone=true;
    persist();
  }
}

function getStatut(v){for(var i=0;i<STATUTS.length;i++)if(STATUTS[i].v===v)return STATUTS[i];return STATUTS[0]}

// Sync encyclopedia with actual plant collection
function syncWishlistWithPlants(){
  if(!D.plants||!D.wishlist)return;
  var changed=false;
  // Build a map of plant names in collection (lowercase)
  var plantNames={};
  D.plants.forEach(function(p){plantNames[p.name.toLowerCase().trim()]=true});

  D.wishlist.forEach(function(w){
    var inPlants=plantNames[w.name.toLowerCase().trim()];
    // If plant is in collection but wishlist status is still "à voir" or "à acheter" or "commandé" → upgrade to "collection"
    if(inPlants && (w.status==='a_voir'||w.status==='a_acheter'||w.status==='commande')){
      w.status='collection';
      changed=true;
    }
  });

  // Also check if plants in D.plants are missing from wishlist → add them
  D.wishlist.forEach(function(w){plantNames[w.name.toLowerCase().trim()]=w});
  D.plants.forEach(function(p){
    var pn=p.name.toLowerCase().trim();
    if(!plantNames[pn]||plantNames[pn]===true){
      // Plant exists in collection but not in encyclopedia → add it
      D.wishlist.push({id:gid(),name:p.name,rusticity:parseInt(p.rusticity)||-10,fruct:[],
        fb:0,fc:0,priority:3,status:'collection',notes:'',
        cat:'',type:p.variety||'',usage:'',rem:'',src:p.nursery||''});
      changed=true;
    }
  });

  if(changed)persist();
}

var diagStep=0,diagAnswers={},diagResult=null;

function diagReset(){diagStep=0;diagAnswers={};diagResult=null;}

function diagCalculate(){
  var res=CARENCES.map(function(c){
    var score=0,total=0;
    Object.keys(c.match).forEach(function(k){
      total++;
      if(diagAnswers[k]===c.match[k])score+=3;
      else if(k==='zone'&&diagAnswers[k]==='toutes')score+=1;
    });
    return {carence:c,score:score,pct:Math.round(score/(total*3)*100)};
  });
  // Un parasite ou une cause observee directement passe avant une carence supposee
  res.sort(function(a,b){return b.pct-a.pct||(b.carence.match.extra?1:0)-(a.carence.match.extra?1:0)||b.score-a.score});
  diagResult={best:res[0],others:res.slice(1,3).filter(function(s){return s.pct>=25})};
}

function getRepotAlerts(){
  var now=new Date(),alerts=[];
  D.plants.forEach(function(p){
    if(inGround(p))return; // pas de rempotage en pleine terre
    if(!p.purchaseDate)return;
    var purchase=new Date(p.purchaseDate+'T00:00:00');
    var years=(now-purchase)/(365.25*864e5);
    var lastRepot=lastRepotDate(p.id);
    var ref=lastRepot?new Date(lastRepot+'T00:00:00'):purchase;
    var sinceLast=(now-ref)/(365.25*864e5);
    var status='ok',label='',color='';
    if(sinceLast>=3){status='urgent';label='Rempotage urgent (\u00e0 faire !)';color='var(--red)';}
    else if(sinceLast>=2){status='soon';label='Rempotage \u00e0 pr\u00e9voir';color='var(--accent)';}
    else if(sinceLast>=1.5){status='ok_soon';label='Rempotage dans ~6 mois';color='var(--green)';}
    else{status='ok';label='';color='';}
    if(status!=='ok')alerts.push({plant:p,status:status,label:label,color:color,years:Math.round(sinceLast*10)/10});
  });
  alerts.sort(function(a,b){var o={urgent:0,soon:1,ok_soon:2};return (o[a.status]||0)-(o[b.status]||0)});
  return alerts;
}

function rRepotBanner(){
  var alerts=getRepotAlerts().filter(function(a){return a.status==='urgent'||a.status==='soon'});
  if(!alerts.length)return '';
  var h='<div class="cd" style="background:var(--accent-l);border:1.5px solid rgba(232,130,12,.25)">';
  h+='<div class="fc" style="gap:8px;margin-bottom:8px"><span style="font-size:20px">\ud83e\udeb4</span><strong style="color:var(--accent)">Rempotage \u00e0 pr\u00e9voir</strong></div>';

var TASK_COLORS={engrais:{bg:'var(--green-l)',color:'var(--green)',icon:'\ud83e\uddea'},
                 taille:{bg:'var(--blue-l)',color:'var(--blue)',icon:'\u2702\ufe0f'},

function careOfTask(t){
  if(t.type==='taille')return 'prune';
  if(t.title.indexOf('Rempotage')===0)return 'repot';
  if(t.title.indexOf('Rentrer')===0)return 'winter_in';
  if(t.title.indexOf('Sortir')===0)return 'winter_out';
  if(t.type==='engrais')return 'fertilizer';
  return 'other';
}
function tkey(m,title,loc){
  var s=title+'|'+loc,hsh=5381;
  for(var i=0;i<s.length;i++)hsh=((hsh*33)^s.charCodeAt(i))>>>0;
  return new Date().getFullYear()+'_'+m+'_'+hsh.toString(36);
}
function taskDone(t){return (D.settings.tasksDone||{})[t.key]||''}
function taskBtn(t){
  var d=taskDone(t);
  if(d)return '<div class="fb" style="margin-top:10px"><span style="font-size:12px;color:var(--green);font-weight:700">✓ Fait le '+fd(d)+'</span><button class="bs bs-n" data-taskundo="'+t.key+'">Annuler</button></div>';
  return '<button class="bs bs-g" style="margin-top:10px;padding:9px 16px;font-size:13px" data-taskdo="'+t.key+'">✓ C\'est fait</button>';
}

function getTasksForMonth(m){
  if(!D.plants.length)return[];
  var tasks=[];
  TASKS_DB.forEach(function(t){
    if(t.months.indexOf(m)<0)return;
    var concerned=D.plants.filter(function(p){return t.locs.indexOf(p.location)>=0});
    if(!concerned.length)return;

    // Séparer pleine terre vs pot/serre (les conseils pot/serre sont souvent les mêmes)
    var potSerre=concerned.filter(function(p){return p.location==='pot'||p.location==='serre'});
    // Taches propres aux pots : pas pour les plantes en pleine terre dans la serre
    if(t.title.indexOf('Rempotage')===0||t.title.indexOf('Surfa')===0||t.title.indexOf('drainage')>=0)potSerre=potSerre.filter(function(p){return !inGround(p)});
    var terre=concerned.filter(function(p){return p.location==='pleine_terre'});

    if(potSerre.length&&(t.locs.indexOf('pot')>=0||t.locs.indexOf('serre')>=0)){
      var desc=t.desc.pot||t.desc.serre||t.desc[Object.keys(t.desc)[0]];
      tasks.push({type:t.type,emoji:t.emoji,title:t.title,desc:desc,priority:t.priority,
        plants:potSerre,location:'pot_serre',key:tkey(m,t.title,'pot_serre'),care:careOfTask(t)});
    }
    if(terre.length&&t.locs.indexOf('pleine_terre')>=0){
      var desc2=t.desc.pleine_terre||t.desc[Object.keys(t.desc)[0]];
      tasks.push({type:t.type,emoji:t.emoji,title:t.title,desc:desc2,priority:t.priority,
        plants:terre,location:'pleine_terre',key:tkey(m,t.title,'pleine_terre'),care:careOfTask(t)});
    }
  });

  var prio={haute:0,moyenne:1,faible:2};
  tasks.sort(function(a,b){return (prio[a.priority]||1)-(prio[b.priority]||1)});
  return tasks;
}

function rStats(){
  var years={};D.careLogs.forEach(function(l){if(l.date)years[l.date.slice(0,4)]=true});
  var ys=Object.keys(years).sort().reverse(),cur=''+new Date().getFullYear();

  var h='<div class="hdr"><button data-go="home" style="background:none;border:none;cursor:pointer;color:#fff;font-size:14px;margin-bottom:8px;padding:0;font-family:inherit">← Retour</button><h1>📊 Bilan</h1><div class="hdr-sub">Récoltes et soins, année par année</div></div><div class="sec">';
  if(!ys.length)return h+'<div class="empty"><div style="font-size:40px">📊</div><div style="font-size:14px;margin-top:8px">Enregistre des soins et des récoltes pour voir ton bilan</div></div></div>';
  h+='<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto">';
  ys.forEach(function(y){h+='<button class="bs '+(y===statsYear?'bs-a':'bs-n')+'" data-statsy="'+y+'" style="padding:8px 16px;font-size:13px">'+y+'</button>'});
  h+='</div>';
  function sumYear(y){var t=0;D.careLogs.forEach(function(l){if(l.type==='fruit'&&l.date&&l.date.slice(0,4)===y)t+=parseInt(l.fruitCount)||0});return t;}
  var logs=D.careLogs.filter(function(l){return l.date&&l.date.slice(0,4)===statsYear});
  var byP={},byT={},total=0;
  logs.forEach(function(l){
    byT[l.type]=(byT[l.type]||0)+1;
    if(l.type==='fruit'){var n=parseInt(l.fruitCount)||0;byP[l.plantId]=(byP[l.plantId]||0)+n;total+=n;}
  });
  var prevY=''+(parseInt(statsYear)-1),prev=ys.indexOf(prevY)>=0?sumYear(prevY):null;
  h+='<div style="display:flex;gap:10px;margin-bottom:14px">';
  h+='<div class="kpi"><div class="kn" style="color:var(--accent)">'+total+'</div><div class="kl">Fruits récoltés</div>'+(prev!==null?'<div style="font-size:12px;color:var(--muted);margin-top:4px">'+prev+' en '+prevY+'</div>':'')+'</div>';
  h+='<div class="kpi"><div class="kn" style="color:var(--green)">'+logs.length+'</div><div class="kl">Soins</div></div>';
  h+='</div>';
  h+='<div class="sec-label">🍊 Récolte par plante</div>';
  var rows=Object.keys(byP).map(function(id){var pl=D.plants.find(function(p){return p.id===id});return {name:pl?pl.name:'?',n:byP[id]}}).filter(function(r){return r.n>0}).sort(function(a,b){return b.n-a.n});
  if(!rows.length)h+='<div class="cd" style="text-align:center;color:var(--muted);font-size:13px">Aucune récolte enregistrée en '+statsYear+'</div>';
  else{
    var mx=rows[0].n;
    h+='<div class="cd">';
    rows.forEach(function(r){
      h+='<div style="margin-bottom:10px"><div class="fb" style="font-size:13px;margin-bottom:4px"><span style="font-weight:600">'+esc(r.name)+'</span><span style="font-weight:700;color:var(--accent)">'+r.n+'</span></div><div style="height:8px;background:#F5EDE0;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+Math.max(4,Math.round(r.n/mx*100))+'%;background:var(--accent);border-radius:4px"></div></div></div>';
    });
    h+='</div>';
  }
  h+='<div class="sec-label" style="margin-top:16px">📅 Soins de l\'année</div><div class="cd">';
  CARE_TYPES.forEach(function(t){if(byT[t.v])h+='<div class="ir"><span>'+t.e+' '+t.l+'</span><span style="font-weight:700">'+byT[t.v]+'</span></div>'});
  h+='</div>';
  return h+'</div>';
}

  var s=D.plants.filter(function(p){return p.location==='serre'}).length;
  var wlCount=D.wishlist?D.wishlist.length:ENC_DEFAULTS.length;

  // Header
  var h='<div class="hdr">';

    h+='<div class="user-bar">'+(currentUser.photoURL?'<img src="'+currentUser.photoURL+'" alt="">':'')+'<span>'+esc(currentUser.displayName||currentUser.email)+'</span></div>';

  // KPI

  h+='<div class="kpi"><div class="kn" style="color:var(--green)">'+D.careLogs.length+'</div><div class="kl">Soins</div></div>';
  h+='<div class="kpi" style="cursor:pointer" data-go="enc"><div class="kn" style="color:var(--blue)">'+wlCount+'</div><div class="kl">Vari\u00e9t\u00e9s</div></div>';
  h+='</div>';

  h+='<div class="sec">';

  // Frost alerts
  h+='<div id="cloud-warn">'+cloudWarn()+'</div>';
  h+=rFrostBanner();

  // Arrosage : liste des plantes + bouton en un geste
  if(w.length){

    h+='<div class="cd" style="background:var(--blue-l);border:1.5px solid rgba(52,152,219,.25)">';
    h+='<div class="fb" style="margin-bottom:8px"><strong style="color:#1565C0;font-size:14px">💧 À arroser ('+w.length+')</strong><button class="bs" style="background:var(--blue);color:#fff" data-qwall>Tout arrosé ✓</button></div>';
    h+='<div style="max-height:260px;overflow-y:auto">';
    w.forEach(function(p){
      var d=lwm[p.id],days=d?Math.floor((Date.now()-new Date(d+'T00:00:00'))/864e5):null;
      h+='<div class="ri" style="border-color:rgba(52,152,219,.15)"><div class="g1" data-det="'+p.id+'" style="cursor:pointer"><div style="font-size:13px;font-weight:700">'+esc(p.name)+'</div><div style="font-size:12px;color:var(--muted)">'+locI(p.location).l+' • '+(days===null?'jamais arrosé':days===0?'arrosé aujourd\'hui':'il y a '+days+' j')+'</div></div><button class="bs bs-a" data-qw="'+p.id+'">Arrosé ✓</button></div>';
    });
    h+='</div></div>';
  }
  if(D.settings.wateringReminder&&rainedRecently()&&D.plants.some(function(p){return p.location==='pleine_terre'})){
    h+='<div style="font-size:12px;color:var(--muted);margin:0 4px 12px">🌧️ Il a plu récemment ('+weatherData.rain3+' mm en 3 jours) : pas de rappel pour la pleine terre.</div>';
  }

  // Weather
  h+=rWeatherSummary();

  // Quick actions - with colored backgrounds
  h+='<div class="sec-label">\u26a1 Actions rapides</div>';
  h+='<div class="quick-grid">';
  h+='<div class="qk" style="background:linear-gradient(135deg,#FFF0DB,#FFE4BF)" data-go="enc"><span style="font-size:28px">\ud83d\udcd6</span><div><div class="qk-tl">Encyclop\u00e9die</div><div class="qk-tv">'+wlCount+' fiches</div></div></div>';
  h+='<div class="qk" style="background:linear-gradient(135deg,#FDECEB,#FADBD8)" data-go="diag"><span style="font-size:28px">\ud83e\ude7a</span><div><div class="qk-tl">Diagnostic</div><div class="qk-tv">Carences, parasites</div></div></div>';
  var calNow=getTasksForMonth(new Date().getMonth()).filter(function(t){return !taskDone(t)});
  h+='<div class="qk" style="background:linear-gradient(135deg,#EBF5FB,#D4E6F1)" data-go="cal"><span style="font-size:28px">\ud83d\udcc5</span><div><div class="qk-tl">Calendrier</div><div class="qk-tv">'+calNow.length+' à faire</div></div></div>';
  h+='<div class="qk" style="background:linear-gradient(135deg,#E8F8F0,#D5F5E3)" data-go="greenhouse"><span style="font-size:28px">\ud83c\udfe0</span><div><div class="qk-tl">Ma serre</div><div class="qk-tv">'+s+' agrume'+(s>1?'s':'')+'</div></div></div>';
  h+='</div>';

  // Mes agrumes
  if(D.plants.length){
    h+='<div class="sec-label">\ud83c\udf3f Mes agrumes</div>';
    D.plants.slice(0,4).forEach(function(p){
      var lo=locI(p.location);
      h+='<div class="cd" style="padding:14px;display:flex;align-items:center;gap:14px;cursor:pointer" data-det="'+p.id+'">';

      // Avatar
      var colors=[['#FFF0DB','#E67E22'],['#E8F8F0','#27AE60'],['#EBF5FB','#3498DB'],['#F4ECF7','#8E44AD']];
      var ci=D.plants.indexOf(p)%4;
      if(p.photo){
        h+='<img src="'+p.photo+'" style="width:48px;height:48px;border-radius:14px;object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.1)">';
      } else {
        h+='<div style="width:48px;height:48px;border-radius:14px;background:'+colors[ci][0]+';display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.06)"><span style="font-size:22px">\ud83c\udf4a</span></div>';
      }

      h+='<div style="flex:1;min-width:0">';
      h+='<div style="font-size:15px;font-weight:700;color:var(--txt)">'+esc(p.name)+'</div>';
      h+='<div style="font-size:12px;color:var(--muted);margin-top:2px">'+lo.l+(p.nursery?' \u2022 '+esc(p.nursery):'')+'</div>';

      // Tags
      h+='<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">';
      var rc2=parseInt(p.rusticity||0)<=-14?'var(--green)':parseInt(p.rusticity||0)<=-12?'var(--blue)':'var(--accent)';
      var rb2=parseInt(p.rusticity||0)<=-14?'var(--green-l)':parseInt(p.rusticity||0)<=-12?'var(--blue-l)':'var(--accent-l)';
      h+='<span class="bdg" style="background:'+rb2+';color:'+rc2+'">\u2744\ufe0f '+(p.rusticity||'?')+'\u00b0C</span>';
      var harv=fmtHarvest(p);
      if(harv)h+='<span class="bdg" style="background:#F0E0CC;color:var(--muted)">'+harv+'</span>';
      h+='</div>';

      // Fruct bar
      if(p.harvestStart!==''&&p.harvestEnd!==''){
        h+='<div style="display:flex;gap:2px;margin-top:6px">';
        var hs=parseInt(p.harvestStart),he=parseInt(p.harvestEnd);
        for(var mi=0;mi<12;mi++){
          var isH=(hs<=he)?(mi>=hs&&mi<=he):(mi>=hs||mi<=he);
          h+='<div style="flex:1;height:5px;border-radius:3px;background:'+(isH?'var(--accent)':'#F0E0CC')+'"></div>';
        }
        h+='</div>';
      }
      h+='</div>';

      // Chevron
      h+='<span style="font-size:18px;color:var(--brd)">\u203a</span>';
      h+='</div>';
    });
    if(D.plants.length>4){
      h+='<button class="btn btn-p w100 jc" style="margin-top:4px" data-go="plants">Voir les '+D.plants.length+' plantes \u2192</button>';
    }
  }

  // Repot
  h+=rRepotBanner();
  h+=rFertSection();

  // Recent activity
  if(rc.length){
    h+='<div class="fb" style="margin:16px 0 10px"><div class="sec-label" style="margin:0">\ud83d\udcc8 Activit\u00e9 r\u00e9cente</div><button class="bs bs-a" data-go="care">Tout voir</button></div>';
    rc.forEach(function(log){
      var pl=D.plants.find(function(p){return p.id===log.plantId});
      h+='<div class="ri"><span style="font-size:20px">'+(TE[log.type]||TE.other)+'</span><div class="g1"><div style="font-size:13px;font-weight:700">'+esc(pl?pl.name:'?')+' \u2014 '+(TL[log.type]||TL.other)+'</div><div style="font-size:12px;color:var(--muted)">'+fd(log.date)+(log.fertilizerType?' \u2022 '+esc(log.fertilizerType):'')+(log.fruitCount?' \u2022 '+log.fruitCount+' fruits':'')+'</div></div></div>';
    });
  }

  // Bilan
  if(D.careLogs.length){
    h+='<div class="qk" style="margin-top:14px;cursor:pointer;background:linear-gradient(135deg,#FFF0DB,#FFE4BF)" data-go="stats"><span style="font-size:28px">📊</span><div><div class="qk-tl">Bilan des récoltes</div><div class="qk-tv">Fruits et soins par année</div></div></div>';
  }

  // Share
  if(D.plants.length>=1){
    h+='<div class="qk" style="margin-top:14px;cursor:pointer;background:linear-gradient(135deg,#F4ECF7,#E8DAEF)" data-go="share"><span style="font-size:28px">\ud83d\udce4</span><div><div class="qk-tl">Partager ma collection</div><div class="qk-tv">'+D.plants.length+' agrume'+(D.plants.length>1?'s':'')+'</div></div></div>';
  }

  // Empty state
  if(!D.plants.length){
    h+='<div class="empty"><div style="font-size:56px;margin-bottom:16px">\ud83c\udf31</div><div style="font-size:18px;font-weight:700;margin-bottom:6px">C\'est encore vide ici !</div><div style="font-size:13px;margin-bottom:16px">Ajoute ta premi\u00e8re plante pour commencer</div><button class="btn btn-p" style="padding:14px 28px;font-size:16px" data-do="add-plant">\uff0b Ajouter un agrume</button></div>';
  }

  // Footer
  h+='<div style="text-align:center;padding:20px 0 8px"><div style="font-size:28px;margin-bottom:6px">\ud83c\udf4b</div><div style="font-size:13px;font-weight:700;color:var(--txt)">Mon Jardin d\'Agrumes</div><div style="font-size:11.5px;color:var(--muted);margin-top:2px">v'+VER+' • Terra Citrus</div></div>';

  return h+'</div>';
}

  h+='<div class="fc jc" style="gap:8px;margin-bottom:16px;flex-wrap:wrap"><span style="font-size:12px;color:var(--muted)">Taille :</span>';

    h+='<div class="gc'+(pl?' hp':'')+(GS===k?' sel':'')+'" data-cell="'+k+'">'+(pl?'<span style="font-size:18px">\ud83c\udf4a</span><span style="line-height:1.1;margin-top:2px">'+esc(pl.name)+'</span>':'<span style="font-size:16px;opacity:.3">+</span>')+'</div>';
  }
  h+='</div></div>';
  if(GM&&GS){
    var sp=D.plants.filter(function(p){return p.location==='serre'}),ai=Object.values(gh.positions);
    h+='<div class="cd" style="margin-top:12px;border:2px solid var(--accent)"><div style="font-weight:600;margin-bottom:8px">Placer une plante ici :</div>';
    if(gh.positions[GS])h+='<button class="bs bs-r" style="margin-bottom:8px" data-grem="'+GS+'">Retirer</button>';
    var av=sp.filter(function(p){return ai.indexOf(p.id)<0||gh.positions[GS]===p.id});

  }
  return h+'</div>';
}

// ── PLANTS ──
function rP(){
  var fl=D.plants.filter(function(p){return PF==='all'||p.location===PF}).filter(function(p){return !PS||p.name.toLowerCase().indexOf(PS.toLowerCase())>=0||(p.variety||'').toLowerCase().indexOf(PS.toLowerCase())>=0});

  // Tri
  if(PSORT==='name')fl.sort(function(a,b){return a.name.localeCompare(b.name)});
  else if(PSORT==='rust')fl.sort(function(a,b){return (parseInt(a.rusticity)||0)-(parseInt(b.rusticity)||0)});
  else if(PSORT==='rootstock')fl.sort(function(a,b){return (a.rootstock||'ZZZ').localeCompare(b.rootstock||'ZZZ')});

  var h='<div class="hdr"><div class="fb"><h1>\ud83c\udf3f Mes Agrumes</h1><button class="btn btn-w" style="padding:8px 14px;font-size:13px" data-do="add-plant">\uff0b Ajouter</button></div></div><div class="sec">';
  h+='<input class="inp" style="margin-bottom:12px" placeholder="\ud83d\udd0d Rechercher..." value="'+esc(PS)+'" data-search>';

  // Filtres emplacement
  h+='<div style="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto"><button class="bs '+(PF==='all'?'bs-a':'bs-n')+'" data-pf="all" style="white-space:nowrap">Tous</button>';
  LOCS.forEach(function(l){h+='<button class="bs '+(PF===l.v?'bs-a':'bs-n')+'" data-pf="'+l.v+'" style="white-space:nowrap">'+l.l+'</button>'});
  h+='</div>';

  // Tri
  var SORTS=[{v:'name',l:'\ud83d\udcda A\u2192Z'},{v:'rust',l:'\u2744\ufe0f Rusticit\u00e9'},{v:'rootstock',l:'\ud83c\udf33 Porte-greffe'}];
  h+='<div style="display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;align-items:center"><span style="font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap">Trier :</span>';
  SORTS.forEach(function(s){h+='<button class="bs '+(PSORT===s.v?'bs-g':'bs-n')+'" data-psort="'+s.v+'" style="white-space:nowrap;font-size:12px">'+s.l+'</button>'});
  h+='</div>';

  if(!fl.length)h+='<div class="empty"><div style="font-size:40px">\ud83d\udd0d</div><div style="font-size:14px;margin-top:8px">Aucune plante trouv\u00e9e</div></div>';
  else{
    // Info de tri visible
    h+='<div style="font-size:12px;color:var(--muted);margin-bottom:8px">'+fl.length+' plante'+(fl.length>1?'s':'')+' affich\u00e9e'+(fl.length>1?'s':'')+'</div>';
    fl.forEach(function(p){
      var lo=locI(p.location),la=D.careLogs.filter(function(c){return c.plantId===p.id}).sort(function(a,b){return b.date.localeCompare(a.date)})[0];
      h+='<div class="cd" data-see="'+p.id+'" style="display:flex;gap:12px;align-items:center;cursor:pointer">'+(p.photo?'<img src="'+p.photo+'" style="width:44px;height:44px;border-radius:10px;object-fit:cover">':'<div style="font-size:32px">\ud83c\udf4a</div>')+'<div class="g1"><div style="font-weight:700;font-size:15px">'+esc(p.name)+'</div>';
      if(p.variety)h+='<div style="font-size:12px;color:var(--muted)">'+esc(p.variety)+'</div>';
      h+='<div style="display:flex;gap:6px;margin-top:4px"><span class="bdg '+bc(lo.c)+'">'+lo.l+'</span>'+(p.rusticity?'<span class="bdg bdg-b">\u2744\ufe0f '+p.rusticity+'\u00b0C</span>':'')+'</div></div>';
      // Info contextuelle selon le tri actif
      var sortInfo='';
      if(PSORT==='rust')sortInfo=(p.rusticity||'?')+'\u00b0C';
      else if(PSORT==='rootstock')sortInfo=esc(p.rootstock)||'\u2014';
      else sortInfo=la?fd(la.date):'';
      h+='<div style="text-align:right;font-size:12px;color:var(--muted)">'+sortInfo+'</div></div>';
    });
  }
  return h+'</div>';
}

// ── DETAIL ──
function rD(){
  var p=D.plants.find(function(x){return x.id===SI});
  if(!p){V='plants';R();return '';}
  var logs=D.careLogs.filter(function(l){return l.plantId===p.id}).sort(function(a,b){return b.date.localeCompare(a.date)});
  var lo=locI(p.location),tf=0,fc=0,lw=null;
  logs.forEach(function(l){if(l.type==='fruit')tf+=parseInt(l.fruitCount)||0;if(l.type==='fertilizer')fc++;if(l.type==='watering'&&!lw)lw=l});
  var h='<div class="hdr" style="padding-top:max(14px,env(safe-area-inset-top))"><button data-go="plants" style="background:none;border:none;cursor:pointer;color:#fff;font-size:14px;margin-bottom:8px;padding:0;font-family:inherit">\u2190 Retour</button>';
  h+='<div class="fc" style="gap:12px">'+(p.photo?'<img src="'+p.photo+'" style="width:56px;height:56px;border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,.3)">':'<div style="font-size:40px">\ud83c\udf4a</div>')+'<div><h1 style="font-size:24px">'+esc(p.name)+'</h1>'+(p.variety?'<div style="opacity:.8;font-size:14px">'+esc(p.variety)+'</div>':'')+'</div></div></div><div class="sec">';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><span class="bdg '+bc(lo.c)+'">'+lo.l+'</span><span class="bdg bdg-b">\u2744\ufe0f '+(p.rusticity||'?')+'\u00b0C</span><div class="g1"></div><button class="bs bs-a" data-do="edit-plant">\u270f\ufe0f Modifier</button><button class="bs bs-r" data-xp="'+p.id+'">\ud83d\uddd1\ufe0f</button></div>';

  // Repot indicator for pot/serre plants
  if(!inGround(p)&&p.purchaseDate){
    var _now=new Date(),_ref=new Date(p.purchaseDate+'T00:00:00'),_lastR=null;
    _lastR=lastRepotDate(p.id);
    if(_lastR)_ref=new Date(_lastR+'T00:00:00');
    var _yrs=Math.round((_now-_ref)/(365.25*864e5)*10)/10;
    if(_yrs>=2){
      var _col=_yrs>=3?'var(--red)':'var(--accent)';var _bg=_yrs>=3?'var(--red-l)':'var(--accent-l)';
      var _lbl=_yrs>=3?'Rempotage urgent !':'Rempotage \u00e0 pr\u00e9voir bient\u00f4t';
      h+='<div class="cd" style="background:'+_bg+';border:1.5px solid '+_col+'30;padding:12px"><div class="fc" style="gap:8px"><span style="font-size:18px">\ud83e\udeb4</span><div><div style="font-size:13px;font-weight:700;color:'+_col+'">'+_lbl+'</div><div style="font-size:12px;color:var(--muted)">Dernier rempotage il y a ~'+_yrs+' an'+(_yrs>1?'s':'')+'. Les agrumes en pot se rempotent tous les 2-3 ans au printemps.</div></div></div></div>';
    }
  }

  if(p.photo){h+='<div class="cd" style="padding:8px"><img src="'+p.photo+'" style="width:100%;border-radius:12px;max-height:250px;object-fit:cover"></div>';}

  h+='<div class="cd"><h3 style="margin:0 0 12px;font-size:15px">\ud83d\udccb Fiche</h3>';
  var harv=fmtHarvest(p);
  var infoRows=[{l:'Date d\'achat',v:fd(p.purchaseDate)},{l:'P\u00e9pini\u00e8re',v:esc(p.nursery)||'\u2014'},{l:'Porte-greffe',v:esc(p.rootstock)||'\u2014'},{l:'Rusticit\u00e9',v:(p.rusticity||'?')+'\u00b0C'}];
  if(p.firstFlower)infoRows.push({l:'\ud83c\udf38 1\u00e8re floraison',v:fd(p.firstFlower)});
  if(harv)infoRows.push({l:'R\u00e9colte',v:harv});
  infoRows.forEach(function(r){h+='<div class="ir"><span style="color:var(--muted)">'+r.l+'</span><span style="font-weight:600">'+r.v+'</span></div>'});
  if(p.usage&&p.usage.length){h+='<div style="margin-top:10px"><span style="font-size:12px;color:var(--muted);font-weight:600">UTILISATION</span><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">';p.usage.forEach(function(u){h+='<span class="bdg bdg-a">'+esc(u)+'</span>'});h+='</div></div>';}
  if(p.notes)h+='<div style="margin-top:10px;font-size:13px;color:var(--muted);font-style:italic">'+esc(p.notes)+'</div>';
  h+='</div>';
  h+='<div class="sg" style="margin:12px 0"><div class="cd" style="text-align:center;padding:10px"><div class="sl">Arrosage</div><div style="font-size:13px;font-weight:700;margin-top:4px;color:var(--blue)">'+(lw?fd(lw.date):'\u2014')+'</div></div>';
  h+='<div class="cd" style="text-align:center;padding:10px"><div class="sl">Engrais</div><div style="font-size:13px;font-weight:700;margin-top:4px;color:var(--green)">'+fc+' fois</div></div>';
  h+='<div class="cd" style="text-align:center;padding:10px"><div class="sl">Fruits</div><div style="font-size:13px;font-weight:700;margin-top:4px;color:var(--accent)">'+tf+'</div></div></div>';
  h+='<button class="btn btn-p w100 jc" style="margin-bottom:16px" data-do="add-care-plant">\uff0b Ajouter un soin</button>';

  h+=rPics(p);

  // Derniers soins par type (au lieu de tout l'historique)

function compressPhoto(file,cb,maxSide,quality){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'),max=maxSide||300;
      var w=img.width,h=img.height;
      if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',quality||0.6));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function fmtHarvest(p){
  if(p.harvestStart===''&&p.harvestEnd==='')return '';
  var s=p.harvestStart!==''?MONTHS[parseInt(p.harvestStart)]:'?';
  var e=p.harvestEnd!==''?MONTHS[parseInt(p.harvestEnd)]:'?';
  return s+' \u2192 '+e;
}
